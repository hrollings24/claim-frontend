<ion-app>
  <!-- The menu is only for signed-in users, so it is disabled outright when signed out —
       that stops a swipe from opening it even where no menu button is rendered. -->
  <ion-menu contentId="main-content" [disabled]="!(user$ | async)">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item button *ngIf="activeGameCode" (click)="backToGame()">
          <ion-label>Back to game {{ activeGameCode }}</ion-label>
        </ion-item>

        <ion-item button [disabled]="busy" (click)="createGame()">
          <ion-label>Create game</ion-label>
        </ion-item>

        <ion-item button [disabled]="busy" (click)="joinGame()">
          <ion-label>Join game</ion-label>
        </ion-item>

        <ion-item button (click)="openChallenges()">
          <ion-label>Challenges</ion-label>
        </ion-item>

        <ion-item button (click)="openRules()">
          <ion-label>Rules</ion-label>
        </ion-item>
      </ion-list>

      <ion-list *ngIf="canOfferPush">
        <ion-item>
          <ion-toggle
            [checked]="pushState === 'on'"
            [disabled]="pushBlocked"
            (ionChange)="togglePush($any($event).detail.checked)"
          >
            <ion-label>
              Notifications
              <p *ngIf="pushBlocked">Blocked in your browser settings</p>
            </ion-label>
          </ion-toggle>
        </ion-item>
      </ion-list>
    </ion-content>

    <!-- Pinned to the bottom of the drawer rather than sitting in the navigation list, since
         logging out isn't somewhere you go. ion-footer without a toolbar keeps it plain. -->
    <ion-footer class="menu-footer">
      <div class="account">
        <!-- Next to the sign-out control, so it is obvious which account is about to be left. -->
        <div class="account-identity" *ngIf="user$ | async as user">
          <p class="account-name" *ngIf="user.name">{{ user.name }}</p>
          <p class="account-email">{{ user.email }}</p>
        </div>

        <ion-button fill="clear" size="small" color="medium" [disabled]="busy" (click)="logout()">
          Log out
        </ion-button>
      </div>
    </ion-footer>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
