<ion-app>
  <!-- The menu is only for signed-in users, so it is disabled outright when signed out —
       that stops a swipe from opening it even where no menu button is rendered. -->
  <ion-menu contentId="main-content" [disabled]="!(user$ | async)">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item button [disabled]="busy" (click)="createGame()">
          <ion-label>Create game</ion-label>
        </ion-item>

        <ion-item button [disabled]="busy" (click)="joinGame()">
          <ion-label>Join game</ion-label>
        </ion-item>

        <ion-item button (click)="openChallenges()">
          <ion-label>Challenges</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>

    <!-- Pinned to the bottom of the drawer rather than sitting in the navigation list, since
         logging out isn't somewhere you go. ion-footer without a toolbar keeps it plain. -->
    <ion-footer class="menu-footer">
      <ion-button fill="clear" size="small" color="medium" [disabled]="busy" (click)="logout()">
        Log out
      </ion-button>
    </ion-footer>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
