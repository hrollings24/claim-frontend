<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Claim</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="(user$ | async) as user; else loggedOut">
    <h1 class="ion-text-center">Hello, {{ user.name }}</h1>

    <ion-button expand="block" [disabled]="busy" (click)="createGame()">Create game</ion-button>

    <div class="join">
      <ion-item>
        <ion-input
          label="Game code"
          labelPlacement="stacked"
          placeholder="ABC234"
          maxlength="6"
          autocapitalize="characters"
          [(ngModel)]="joinCode"
        ></ion-input>
      </ion-item>

      <ion-button
        expand="block"
        fill="outline"
        [disabled]="busy || !joinCode.trim()"
        (click)="joinGame()"
      >
        Join game
      </ion-button>
    </div>

    <p *ngIf="gameError" class="ion-text-center error">{{ gameError }}</p>

    <div class="smoke-test">
      <ion-button size="small" fill="clear" (click)="callHello()">Call API</ion-button>
      <p *ngIf="apiResponse">{{ apiResponse }}</p>
      <p *ngIf="apiError">{{ apiError }}</p>
    </div>
  </div>

  <ng-template #loggedOut>
    <div class="centered">
      <h1>Claim</h1>
      <ion-button (click)="login()">Login / Sign Up</ion-button>
    </div>
  </ng-template>
</ion-content>
