<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Join a game</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Join a game</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true" *ngIf="loading">
    <ion-item>
      <ion-label class="muted">Checking your games…</ion-label>
      <ion-spinner slot="end" name="dots"></ion-spinner>
    </ion-item>
  </ion-list>

  <ion-list [inset]="true" *ngIf="!loading && mine.length > 0">
    <ion-list-header>
      <ion-label>Your games</ion-label>
    </ion-list-header>

    <ion-item button *ngFor="let game of mine" [routerLink]="['/lobby', game.code]">
      <ion-label>
        {{ game.code }}
        <p>{{ statusLabel(game.status) }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-list [inset]="true">
    <ion-list-header>
      <ion-label>Have a code?</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-input
        label="Game code"
        labelPlacement="stacked"
        placeholder="e.g. AB23CD"
        maxlength="6"
        autocapitalize="characters"
        [(ngModel)]="code"
        (keyup.enter)="join()"
      ></ion-input>
    </ion-item>
  </ion-list>

  <p *ngIf="error" class="ion-text-center error">{{ error }}</p>

  <ion-button expand="block" [disabled]="!canJoin" (click)="join()">
    {{ joining ? 'Joining…' : 'Join' }}
  </ion-button>
</ion-content>
